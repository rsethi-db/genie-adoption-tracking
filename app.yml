command: ["uvicorn", "genie_adoption_tracking.backend.app:app", "--workers", "1"]

env:
  # App SP lacks CREATE on the default `public` schema; route all objects to the
  # dedicated `genie` schema (SP was granted USAGE, CREATE there). Set per-connection
  # via libpq PGOPTIONS since we can't ALTER the SP role's default search_path.
  - name: PGOPTIONS
    value: "-c search_path=genie,public"
  # DatabaseConfig requires PGAPPNAME (the Lakebase instance name). In production
  # the Databricks Apps runtime injects it; for local `apx dev` it must be set
  # explicitly. The value is unused locally (dev uses APX_DEV_DB_PORT/PWD).
  - name: PGAPPNAME
    value: "genie-adoption-tracking"
  # Genie Space backing the in-app chat assistant (structured gat_* data + docs).
  - name: GENIE_ADOPTION_TRACKING_GENIE_SPACE_ID
    value: "01f18cf8c3a61358b44d253c50b35ebe"
  # Foundation-model endpoint used to parse NL audience descriptions into filters.
  - name: GENIE_ADOPTION_TRACKING_LLM_ENDPOINT
    value: "databricks-gpt-5-4-nano"